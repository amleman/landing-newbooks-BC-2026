# Publica la landing en GitHub Pages en cada push a main.
#
# No hace falta configurar el prefijo de rutas: vite.config.ts lo deduce de
# GITHUB_REPOSITORY, que Actions inyecta solo. Si algún día se pone un dominio
# propio, hay que añadir `env: VITE_BASE: /` al paso de compilar.
#
# Requisito, UNA sola vez, en el repositorio:
#   Settings → Pages → Build and deployment → Source: «GitHub Actions»
# Se intentó que el propio workflow lo activara (`enablement: true` en
# configure-pages), pero el token de Actions no tiene permiso para crear el
# sitio: «Resource not accessible by integration». Es un clic manual y no hay
# forma de evitarlo desde el código.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Solo lectura del código; los permisos de escritura son los que pide Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, se publica el último y se cancela el
# despliegue a medio hacer.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` instala exactamente lo del package-lock.json, sin resolver
      # versiones nuevas: la compilación es reproducible.
      - run: npm ci

      - name: Comprobar tipos y compilar
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
