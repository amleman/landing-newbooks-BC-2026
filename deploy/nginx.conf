# Nginx · Novedades Biblioteca Central USAC
#
# La página es un sitio estático: no hay backend, ni base de datos, ni sesiones.
# Toda la seguridad que queda por poner vive en estas cabeceras y en no servir
# de más. Copiar dentro del bloque `server` correspondiente.
#
# Comprobar la sintaxis y recargar:
#   nginx -t && nginx -s reload

server {
    listen 80;
    server_name novedades.biblioteca.usac.edu.gt;   # ← ajustar

    # Si hay certificado, forzar HTTPS y borrar este bloque por el de abajo.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name novedades.biblioteca.usac.edu.gt;   # ← ajustar

    ssl_certificate     /ruta/al/fullchain.pem;     # ← ajustar
    ssl_certificate_key /ruta/al/privkey.pem;       # ← ajustar
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root  /var/www/novedades;   # ← aquí se copia el contenido de dist/
    index index.html;

    # No anunciar la versión de nginx en las respuestas ni en los errores.
    server_tokens off;

    # Sin listados de directorio: si falta el index, 403, no el contenido.
    autoindex off;

    # ── Cabeceras de seguridad ────────────────────────────────────────────
    # `always` hace que también acompañen a las respuestas de error.

    # Lo que el navegador tiene permitido cargar y ejecutar. La página no habla
    # con ningún servidor externo, así que todo apunta a 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Nadie puede meter la página dentro de un iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # El navegador respeta el Content-Type declarado y no lo adivina: evita que
    # un archivo subido como imagen acabe ejecutándose como script.
    add_header X-Content-Type-Options "nosniff" always;

    # No filtrar la ruta completa al salir hacia Biblos o las redes sociales.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Se renuncia explícitamente a APIs que la página no usa.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Aísla la pestaña de otras ventanas y evita que otros sitios incrusten
    # estos recursos.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Solo con HTTPS ya funcionando y certificado válido. Un año.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Caché ─────────────────────────────────────────────────────────────
    # Los archivos de assets/ llevan un hash en el nombre: cambian de nombre al
    # cambiar de contenido, así que pueden cachearse para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|woff2)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # El index nunca se cachea: es lo que apunta a la versión nueva.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Rutas ─────────────────────────────────────────────────────────────
    # La página es de una sola pantalla: cualquier ruta desconocida vuelve al
    # inicio en vez de dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nada de archivos ocultos ni copias del editor.
    location ~ /\. {
        deny all;
    }
    location ~ ~$ {
        deny all;
    }

    # Compresión: el HTML, el CSS y el JS bajan a menos de un tercio.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
